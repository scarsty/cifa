name: Cifa Unit Test on Windows

on: [push, workflow_dispatch]

jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Unit Test
      run: |
        New-Item -ItemType Directory -Force build | Out-Null
        cl /std:c++20 /EHsc /nologo /W4 /utf-8 /I./ /Fe:build/cifa_unit_test.exe unit_test/cifa_unit_test.cpp CifaBytecode.cpp Cifa.cpp

    - name: Run Cifa Unit Test
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

        ./build/cifa_unit_test.exe